<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cup Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <i class="fas fa-mug-hot"></i>
            <span>Cozy Cup Shop</span>
        </div>
        <nav>
            <a href="#">MENU</a>
            <a href="#">LOCATIONS</a>
            <a href="#">ABOUT</a>
            <a href="#" class="cta-button">ORDER ONLINE</a>
        </nav>
    </header>

    <main>
        
        <section class="hero-section">
            <div class="hero-content">
                <h1>The Art of the Perfect Cup.</h1>
                <a href="#" class="cta-button primary">ORDER ONLINE</a>
        
            </div>
        </section>

        <section class="content-section">
            <div class="about-us">
                <img src="https://images.stockcake.com/public/4/3/9/43950913-a8d9-4313-80cc-97fd4be8dce5_large/cozy-coffee-shop-stockcake.jpg" alt="Interior of the coffee shop">
                <div class="text-content">
                    <h2>Our Passion</h2>
                    <p>A welcoming space where every cup tells a story of ethical sourcing and careful craft.</p>
                </div>
            </div>

            <h2>Featured Menu</h2>
            <div class="featured-menu">
                <div class="menu-item">
                    <img src="https://imgcdn.stablediffusionweb.com/2024/4/30/496f14cb-9b74-411a-b3bc-68d12d55720d.jpg" alt="Latte Art">
                    <p class="name">Latte</p>
                    <p class="price">$5.99</p>
                </div>
                <div class="menu-item">
                    <img src="https://img.freepik.com/premium-photo/fresh-croissant-plate-black-background-top-view-homemade-baked-goods_752567-6174.jpg" alt="Croissant">
                    <p class="name">Fresh-Baked Croissant</p>
                    <p class="price">$3.49</p>
                </div>
                <div class="menu-item">
                    <img src="https://www.lifeloveandsugar.com/wp-content/uploads/2025/04/Chocolate-Muffins2.jpg" alt="Muffins">
                    <p class="name">Muffins</p>
                    <p class="price">$10.99</p>
                </div>
            </div>
        </section>

    </main>
    
    </body>
</html>
